name: Deploy

# Reusable deployment for one environment. The repository owns the trigger, the
# order and the gates: each Render service has auto-deploy turned off, and this
# workflow asks Render to build the exact commit only after the migrations have
# applied. Callers choose the environment, and nothing else differs between
# development and production.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment holding this target's secrets.
        required: true
        type: string
      site-url:
        description: Public origin of this environment, checked after the deploy.
        required: true
        type: string
    secrets:
      RENDER_API_KEY:
        required: true
      RENDER_SERVICE_ID:
        required: true
      SUPABASE_ACCESS_TOKEN:
        required: true
      SUPABASE_PROJECT_REF:
        required: true
      SUPABASE_DB_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.site-url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      # Migrations run before the deployment so the schema can never trail the
      # code that expects it. CLI output may carry credentials, so it is not
      # echoed; only the outcome is reported.
      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          # CLI output can carry credentials, so it is never echoed verbatim.
          # A failure with no reason at all cannot be diagnosed from a CI log,
          # so the tail is relayed with credential-shaped values redacted.
          redact() {
            sed -E \
              -e 's/eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]+/[redacted-token]/g' \
              -e 's/(sbp|sb_publishable|sb_secret|sb)_[A-Za-z0-9_-]{8,}/[redacted-key]/g' \
              -e 's#(://[^:[:space:]]+:)[^@[:space:]]+@#\1[redacted]@#g' \
              -e 's/[A-Za-z0-9_-]{40,}/[redacted-value]/g'
          }
          if ! supabase link --project-ref "$PROJECT_REF" --workdir src >link.log 2>&1; then
            echo "::error::Could not link the ${{ inputs.environment }} Supabase project. Check SUPABASE_PROJECT_REF and SUPABASE_ACCESS_TOKEN."
            tail -n 30 link.log | redact
            exit 1
          fi
          if ! supabase db push --workdir src >push.log 2>&1; then
            echo "::error::Migration push failed for ${{ inputs.environment }}."
            tail -n 40 push.log | redact
            exit 1
          fi
          rm -f link.log push.log
          echo "Migrations applied to the ${{ inputs.environment }} project."

      # Render clones the repository and builds this exact commit itself, so the
      # build reads RENDER_GIT_COMMIT for /api/health. Render does not check who
      # authored the commit; the repository's own required checks and
      # environment reviewers decide what may deploy. A free-plan build can take
      # several minutes, so the script waits up to 15 minutes for "live".
      - name: Deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          node src/tooling/render-deploy.mjs "$GITHUB_SHA" 900
          echo "Deployed ${{ inputs.environment }} to ${{ inputs.site-url }}" >>"$GITHUB_STEP_SUMMARY"

      # The public URL must answer with this commit, a reachable database and
      # configured AI. This also catches an older deployment still answering.
      - name: Check the release
        env:
          SITE_URL: ${{ inputs.site-url }}
        run: node src/tooling/check-health.mjs "$SITE_URL" "$GITHUB_SHA"
