name: Deploy development

# The dev branch is the development environment: its own Supabase project, its
# own Render service and its own secrets. RENDER_SERVICE_ID is an environment
# secret, so the two environments simply name different Render services.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  development:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: development
      site-url: https://specforge-dev.onrender.com
    secrets: inherit
