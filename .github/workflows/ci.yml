name: CI

# Every pull request and every push to an environment branch must pass the same
# gates the developer guide documents. No job uses a hosted project or the SoC
# LLM: database and browser checks run against a disposable local stack.

on:
  pull_request:
  push:
    branches: [main, dev]
  # The production deployment calls these same gates, so the rules exist once.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, unit and component tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Component tests run in real Chromium through Vitest browser mode.
      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Verify
        run: npm run verify

  integration:
    name: Database and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start disposable local Supabase
        run: npm run db:start

      - name: Database tests
        run: npm run test:integration

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop local Supabase
        if: always()
        run: npm run db:stop
