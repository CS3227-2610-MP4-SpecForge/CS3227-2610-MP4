name: Deploy production

# main is production. The same gates CI applies to a pull request run again on
# the merge commit, so production is only reached through a reviewed merge that
# still passes them. A required reviewer on the production GitHub Environment
# would add a separate deployment approval; it is not configured yet.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  production:
    needs: checks
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      vercel-environment: production
      production: true
      site-url: https://specforge-prod.vercel.app
    secrets: inherit
