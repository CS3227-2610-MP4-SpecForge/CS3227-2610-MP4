<!--
  Renders ```mermaid blocks from the guides as diagrams. GitHub renders them
  itself; on this site kramdown leaves them as code, so each block is swapped
  for Mermaid's own element and drawn in the browser. The version is pinned
  exactly; change it deliberately.
-->
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
  const blocks = [...document.querySelectorAll("code.language-mermaid, div.language-mermaid code")];
  const nodes = blocks.map(code => {
    const holder = code.closest("div.language-mermaid") ?? code.closest("pre") ?? code;
    const diagram = document.createElement("pre");
    diagram.className = "mermaid";
    diagram.textContent = code.textContent;
    holder.replaceWith(diagram);
    return diagram;
  });
  if (nodes.length) {
    mermaid.initialize({ startOnLoad: false, securityLevel: "strict" });
    await mermaid.run({ nodes });
  }
</script>
