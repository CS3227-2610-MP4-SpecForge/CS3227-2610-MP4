project_id = "specforge"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 55324
smtp_port = 55325
pop3_port = 55326

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
otp_length = 8
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Verify your SpecForge email"
content_path = "./supabase/templates/confirmation.html"

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
token_verifications = 30

[analytics]
enabled = false

[edge_runtime]
enabled = false
